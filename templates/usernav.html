{{#haySesion}}
<details class="acc-menu">
  <summary>
    <span class="acc-avatar" aria-hidden="true">{{inicialesUsuario}}</span>
    <span>
      <span class="acc-user-name">{{usuarioActual}}</span>
      <span class="acc-user-role">{{rolEtiqueta}}</span>
    </span>
  </summary>

  <div class="acc-menu-panel">
    <div class="acc-menu-head">
      <div class="acc-menu-name">{{usuarioActual}}</div>
      <div class="acc-menu-user">@{{usernameActual}}</div>
      <div class="acc-menu-user rol {{rolCss}}">{{rolEtiqueta}}</div>
    </div>

    <a class="acc-menu-link" href="/mi-cuenta">Mi cuenta y contrasena</a>

    {{#puedeUsuarios}}
    <a class="acc-menu-link" href="/usuarios">Usuarios del sistema</a>
    {{/puedeUsuarios}}

    {{#puedeAuditar}}
    <a class="acc-menu-link" href="/auditoria">Bitacora de seguridad</a>
    {{/puedeAuditar}}

    <div class="acc-menu-sep"></div>

    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{csrfToken}}">
      <button class="acc-menu-link" type="submit">Cerrar sesion</button>
    </form>
  </div>
</details>
{{/haySesion}}
