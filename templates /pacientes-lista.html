{{> header}}

<section class="page-head">
  <h1>Pacientes</h1>
  <a class="btn btn-primary" href="/pacientes/nuevo">+ Nuevo paciente</a>
</section>

<form class="search-box" method="get" action="/pacientes">
  <input type="text" name="q" value="{{q}}" placeholder="Buscar por DNI, N° de historia, nombres o apellidos...">
  <button type="submit">Buscar</button>
</form>

<section class="card">
  <table class="table">
    <thead><tr><th>N° Historia</th><th>DNI</th><th>Paciente</th><th>Edad</th><th>Sexo</th><th></th></tr></thead>
    <tbody>
    {{#pacientes}}
      <tr>
        <td><span class="badge">{{numeroHistoria}}</span></td>
        <td>{{dni}}</td>
        <td>{{nombreCompleto}}</td>
        <td>{{edad}}</td>
        <td>{{sexo}}</td>
        <td class="table-actions"><a class="btn btn-sm" href="/pacientes/{{id}}">Ver historia →</a></td>
      </tr>
    {{/pacientes}}
    {{^pacientes}}
      <tr><td colspan="6" class="empty">No hay pacientes que coincidan con la búsqueda.</td></tr>
    {{/pacientes}}
    </tbody>
  </table>
</section>

{{> footer}}
