{{> header}}

<section class="page-head">
  <h1>Nueva operación</h1>
  <a class="link" href="/pacientes/{{paciente.id}}">← Volver a {{paciente.nombreCompleto}}</a>
</section>

<section class="card">
  <p class="patient-context"><span class="badge">{{paciente.numeroHistoria}}</span> {{paciente.nombreCompleto}} · DNI {{paciente.dni}}</p>

  <form method="post" action="/pacientes/{{paciente.id}}/operaciones/nueva" class="form-grid">

    <div class="field field-wide">
      <label for="tipoOperacion">Tipo de operación *</label>
      <input type="text" id="tipoOperacion" name="tipoOperacion" value="{{tipoOperacion}}" required>
    </div>

    <div class="field">
      <label for="fecha">Fecha *</label>
      <input type="date" id="fecha" name="fecha" value="{{fecha}}" required>
    </div>

    <div class="field">
      <label for="cirujano">Cirujano</label>
      <input type="text" id="cirujano" name="cirujano" value="{{cirujano}}">
    </div>

    <div class="field">
      <label for="resultado">Resultado *</label>
      <select id="resultado" name="resultado">
        {{{resultadoOptionsHtml}}}
      </select>
    </div>

    <div class="field field-wide">
      <label for="observaciones">Observaciones</label>
      <textarea id="observaciones" name="observaciones" rows="3">{{observaciones}}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-ghost" href="/pacientes/{{paciente.id}}">Cancelar</a>
    </div>
  </form>
</section>

{{> footer}}
